name: Django CI

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  tests:

    runs-on: ubuntu-latest
    env:
        #Secret used from enviroment secrets from github actions
        #commit comment
        DJANGO_KEY: ${{secrets.DJANGO_KEY}} 
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
      
    - name: Install Dependencies
      run: |
        echo "Django key is (2 first characters): ${DJANGO_KEY::2}"
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      
        
    - name: Run prep for tests
      run: |
        python manage.py makemigrations
        python manage.py migrate
    
    - name: Run Tests
      run: |
        python manage.py test investment_manager.tests
